<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Debounce Homework</title>

  <style>
    .slider {
      max-width: 400px;
      margin: 40px auto;
      text-align: center;
    }

    .slider__input {
      width: 100%;
    }

    .slider__image {
      display: block;
      width: 150px;
      height: auto;
      margin: 20px auto;
      max-width: 100%;
    }

    #box {
      width: 50px;
      height: 50px;
      background-color: red;
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <section class="slider">
    <h2>Завдання 1</h2>
  <input
    type="range"
    min="50"
    max="400"
    value="150"
    class="slider__input"
  />

  <img
    src="https://picsum.photos/300/300"
    alt="Зображення"
    class="slider__image"
  />
  </section>

  <section>
    <h2>Завдання 2</h2>
    <p>Рухай мишкою по сторінці.</p>

    <div id="box"></div>
  </section>

  </section>
