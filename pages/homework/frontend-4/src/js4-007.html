<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS-007 - Handlebars і Parcel</title>
    <link rel="stylesheet" href="./js4-007.css" />
  </head>
  <body>
    <header class="page-header">
      <div class="container">
        <p class="eyebrow">Frontend 4 · JS-007</p>
        <h1>Каталог товарів</h1>
        <p class="subtitle">Handlebars-шаблон, додавання та видалення без localStorage.</p>
      </div>
    </header>

    <main class="container main-content">
      <section class="form-section" aria-labelledby="form-title">
        <h2 id="form-title">Додати товар</h2>

        <form class="product-form" id="product-form">
          <label>
            Назва
            <input name="name" type="text" placeholder="Наприклад, Keyboard" required />
          </label>

          <label>
            Ціна, $
            <input name="price" type="number" min="1" step="0.01" placeholder="100" required />
          </label>

          <label class="description-field">
            Опис
            <textarea name="description" rows="3" placeholder="Короткий опис товару" required></textarea>
          </label>

          <button type="submit">Додати товар</button>
        </form>
      </section>

      <section class="products-section" aria-labelledby="products-title">
        <div class="section-heading">
          <h2 id="products-title">Товари</h2>
          <span class="product-count" id="product-count" aria-live="polite"></span>
        </div>

        <ul class="product-list" id="product-list"></ul>
        <p class="empty-message" id="empty-message" hidden>Список товарів порожній.</p>
      </section>
    </main>

    <script type="module" src="./js4-007.js"></script>
  </body>
</html>
