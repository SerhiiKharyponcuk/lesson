<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Гра та графік</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/pnotify/3.2.1/pnotify.css"
  />

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    .game {
      max-width: 500px;
      margin: 0 auto 50px;
      padding: 25px;
      text-align: center;
      border: 1px solid #cccccc;
      border-radius: 12px;
    }

    #key {
      display: inline-block;
      min-width: 60px;
      margin: 15px;
      padding: 15px;
      font-size: 36px;
      text-transform: uppercase;
      background-color: #eeeeee;
      border-radius: 8px;
    }

    #new-game {
      padding: 10px 20px;
      cursor: pointer;
    }

    .chart-container {
      max-width: 900px;
      margin: 0 auto;
    }
  </style>
</head>

<body>
  <section class="game">
    <h1>Натисни правильну клавішу</h1>

    <p id="message">Натисни клавішу:</p>

    <div id="key"></div>

    <br />

    <button id="new-game" type="button">
      Нова гра
    </button>
  </section>

  <section class="chart-container">
    <h2>Продажі за останній місяць</h2>

    <canvas id="sales-chart"></canvas>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pnotify/3.2.1/pnotify.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="./script.js"></script>

  <script>
    window.runTask();
  </script>
</body>
</html>
