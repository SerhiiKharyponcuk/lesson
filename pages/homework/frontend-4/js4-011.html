<section class="timer-homework">
  <div class="timer-block">
    <h2>Завдання 1. Таймер на одну годину</h2>
    <p class="timer-value" id="hour-timer">01:00:00</p>
    <button type="button" id="start-hour-timer">Почати</button>
    <button type="button" id="reset-hour-timer">Скинути</button>
    <p id="hour-message"></p>
  </div>

  <div class="timer-block">
    <h2>Завдання 2. Таймер на 30 секунд</h2>
    <p class="timer-value" id="seconds-timer">30.000</p>
    <div class="animation-element" id="animation-element"></div>
    <button type="button" id="start-seconds-timer">Почати</button>
    <p id="seconds-message"></p>
  </div>
</section>
