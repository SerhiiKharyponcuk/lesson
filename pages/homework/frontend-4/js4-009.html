<section class="contacts-app">
  <h2>Книга контактів</h2>

  <form id="contact-form">
    <input type="text" id="contact-name" placeholder="Ім'я" required />
    <input type="text" id="contact-surname" placeholder="Прізвище" required />
    <input type="tel" id="contact-phone" placeholder="Телефон" required />
    <input type="email" id="contact-email" placeholder="Електронна адреса" required />
    <button type="submit" id="contact-submit">Додати контакт</button>
  </form>

  <p id="contacts-empty">Контактів ще немає.</p>
  <ul id="contact-list"></ul>
</section>
