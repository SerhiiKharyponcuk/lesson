<section class="async-homework">
  <h2>Вибір редакції Pixabay</h2>
  <details class="settings">
    <summary>API-ключ Pixabay</summary>
    <label for="pixabay-key">Ключ доступу</label>
    <input
      id="pixabay-key"
      type="password"
      autocomplete="off"
      placeholder="Встав свій API-ключ"
    />
  </details>
  <form id="search-form" class="form-row">
    <label for="image-category"
      >Категорія
      <select id="image-category" name="category">
        <option value="">Усі категорії</option>
        <option value="nature">Природа</option>
        <option value="animals">Тварини</option>
        <option value="travel">Подорожі</option>
        <option value="buildings">Архітектура</option>
        <option value="food">Їжа</option>
      </select>
    </label>
    <button class="wsapp-btn" type="submit">Показати фотографії</button>
  </form>
  <p>
    Зображення з
    <a href="https://pixabay.com/" target="_blank" rel="noopener noreferrer"
      >Pixabay</a
    >.
  </p>
  <p class="status" id="gallery-status" role="status" aria-live="polite">
    Вкажи API-ключ і натисни «Показати фотографії».
  </p>
  <ul class="gallery" aria-label="Вибір редакції"></ul>
  <div class="load-more-row">
    <button class="wsapp-btn" id="load-more" type="button" hidden>
      Завантажити ще
    </button>
  </div>
  <template id="photo-template">
    <li>
      <div class="photo-card">
        <button class="photo-link" type="button">
          <img src="" alt="" loading="lazy" width="640" height="400" />
        </button>
        <div class="stats">
          <p class="stats-item" title="Лайки">
            <i class="material-icons" aria-hidden="true">thumb_up</i
            ><span class="sr-only">Лайки:</span><span data-likes></span>
          </p>
          <p class="stats-item" title="Перегляди">
            <i class="material-icons" aria-hidden="true">visibility</i
            ><span class="sr-only">Перегляди:</span><span data-views></span>
          </p>
          <p class="stats-item" title="Коментарі">
            <i class="material-icons" aria-hidden="true">comment</i
            ><span class="sr-only">Коментарі:</span><span data-comments></span>
          </p>
          <p class="stats-item" title="Завантаження">
            <i class="material-icons" aria-hidden="true">cloud_download</i
            ><span class="sr-only">Завантаження:</span
            ><span data-downloads></span>
          </p>
        </div>
        <a class="photo-source" target="_blank" rel="noopener noreferrer"></a>
      </div>
    </li>
  </template>
  <dialog
    class="lightbox"
    id="image-dialog"
    aria-label="Перегляд великого зображення"
  >
    <button class="wsapp-btn" id="close-image" type="button">Закрити</button>
    <img alt="" />
  </dialog>
</section>
