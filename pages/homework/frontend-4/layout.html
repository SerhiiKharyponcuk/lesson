<!doctype html>
<html lang="uk">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Frontend 4 - homeworks</title>

    <link rel="stylesheet" href="../../../assets/base.css" />
    <link rel="stylesheet" id="jsStyle" href="" />
    <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/pnotify/3.2.1/pnotify.css"
/>
</head>

<body class="fe-body">
    <div class="wsapp-shell">
        <header class="wsapp-topbar">
            <div class="wsapp-topbar__left">
                <strong class="wsapp-brand">Frontend 4</strong>
            </div>

            <div class="wsapp-topbar__right">
                <a class="wsapp-btn wsapp-btn--ghost" href="./index.html">← До списку</a>
            </div>
        </header>

        <main class="wsapp-main">
            <h2 class="wsapp-h2" id="taskTitle">Завдання</h2>

            <div class="wsapp-panel">
                  <div style="margin-top:16px">
                    <button class="wsapp-btn" id="runJsBtn" type="button">▶ Запустити код</button>
                </div>
                <div class="fe-task" id="taskContent"></div>
            </div>

            <nav class="wsapp-navTask" aria-label="Навігація завдання">
                <a class="wsapp-btn wsapp-btn--ghost" id="prevTask" href="./index.html">← Попереднє</a>
                <a class="wsapp-btn" id="nextTask" href="./index.html">Наступне →</a>
            </nav>
        </main>
    </div>

    <script src="./loader-task.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pnotify/3.2.1/pnotify.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="./loader-task.js"></script>
</body>

</html>
