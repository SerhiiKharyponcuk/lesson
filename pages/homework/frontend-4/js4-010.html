<section class="timers-homework">
  <div class="timer-task">
    <h2>Завдання 1. Таймер інтервалу</h2>
    <button type="button" id="start-messages">Запустити</button>
    <div id="messages-list"></div>
  </div>

  <div class="timer-task">
    <h2>Завдання 2. Анімація елементів</h2>
    <button type="button" id="start-animation">Старт</button>
    <button type="button" id="stop-animation">Стоп</button>

    <div class="animation-list">
      <div class="animation-box"></div>
      <div class="animation-box"></div>
      <div class="animation-box"></div>
    </div>
  </div>

  <div class="timer-task">
    <h2>Завдання 3. Інтерактивна гра</h2>
    <p>Час: <span id="game-time">10</span></p>
    <p>Очки: <span id="game-score">0</span></p>
    <button type="button" id="start-game">Почати гру</button>

    <div class="game-area" id="game-area">
      <button type="button" id="game-target" disabled>Натисни</button>
    </div>
  </div>

  <div class="timer-task">
    <h2>Завдання 4. Контроль часу</h2>
    <input type="number" id="timeout-seconds" min="1" placeholder="Кількість секунд" />
    <button type="button" id="start-timeout">Встановити таймер</button>
    <p id="timeout-message"></p>
  </div>
</section>
